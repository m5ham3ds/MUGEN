+ FightFXDefaultAnim = -1 ;FightFX default animation, default value is -1
+ SelectPlayerCountMax = 3 ;In arcade, select the maximum number of players, the default value is unlimited
+ StateMax = 51200 ;The maximum number of States in a Statedef, the default value is unlimited
+ StateLoopMax = 255 ;The maximum value of the State loop, the default value is 255
+ Standby = 0 ;Whether the system can enter standby mode and turn off the display, the default value is 0
+ ColorAdd = 0,0,0,0 ;Color adds RGBA, the default value is 0,0,0,0
+ ShowPromptBox = 1 ;Whether to pop up a window to prompt an error, the default value is 1 ;2 pops up a window and displays detailed information, such as animation repeat ;3 is more detailed than 2, such as expression modification

Language = "en" ;Language (ISO 639-1), such as en, es, ja, etc. For language codes, see http://en.wikipedia.org/wiki/List_of_ISO_639-1_codes. If it is empty, the computer language will be automatically detected.
DrawShadows = 1 ;whether to display shadows, if the machine is low end, set it to 0
AfterImageMax = 16 ;Maximum number of afterimages. The smaller the number, the more memory is saved (the minimum is 1)
LayeredSpriteMax = 256 ;The maximum number of images that can exist at the same time. The smaller the number, the more memory is saved (the minimum is 32)
ExplodMax = 256 ;The maximum number of total sparks, the smaller the number, the more memory is saved, the minimum value is 8
SysExplodMax = 128 ;Maximum number of system sparks. The smaller the number, the more memory is saved. The minimum value is 8
HelperMax = 56 ;The maximum number of helpers in total. The smaller the number, the more memory is saved. The minimum value is 4 and the maximum value is 56. DreamWorks has no limit.
PlayerProjectileMax = 32 ;The maximum number of flying props for a single character. The smaller the number, the more memory is saved. The minimum value is 5

[Debug]
Debug = 0 ;When 1, it will enter debug mode at startup
AllowDebugKeys = 1 ;1 means debug keys are allowed at any time, 0 means they are only allowed in debug mode

[Video]
+ RenderMode = OpenGL ;Screen rendering modes include OpenGL (recommended), System, and DirectX (rendered with DX5). System and DirectX do not support advanced features, such as RGB images and window size customization ;DreamWorks adds a CPU specifically for DreamWorks authors, and others should not use it
+ DoubleRes = 0 ;Image quality, the default value is 0 no effect, 1 oil painting effect, 2 interpolation effect, 3 horizontal black line effect, 4 vertical black line effect
StageFit = 1

[Sound]
Sound = 1 ;1 means turn on the sound, 0 means turn off
+ WavSound = 1 ;This setting is only valid when Sound = 1
+ BGMSound = 1 ;This setting is only valid when Sound = 1
StereoEffects = 1 ;0 disables, 1 enables stereo effects
ReverseStereo = 0 ;When it is 1, the left and right channels are swapped, usually unchanged
WavChannels = 32 ;The number of channels, that is, how many sounds can exist at the same time
MasterVolume = 100 ;Global volume
WavVolume = 80 ;Sound effect volume
BGMVolume = 75 ;BGM volume
PauseBGMOnDefocus = 1 ;When set to 1, the game will automatically pause BGM when the focus is not on the game window

[Misc]
PlayerCache = 2 ;The number of additional characters to store. The smaller the number, the less space is occupied, but it will be read more frequently
PauseOnDefocus = 1 ;When set to 1, the game will automatically pause when the focus is not on the game window

[Arcade]
AI.RandomColor = 1 ;if set to 0, AI only uses 1P color, if set to 1, it uses random P color

