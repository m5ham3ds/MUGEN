[Options]
Difficulty = 4 ;Difficulty of enemy AI, (if changed, modify all "AILevel = 4" below "modifications" in the systemAI.cns file to match the difficulty you set)
Life = 100 ;The life value (physical value) percentage of the game character
Time = 99 ;The time a round lasts (-1 means infinite time)
Team.LoseOnKO = 1 ;AI execution after death, 0 = Teammate AI also loses after the player dies, 1 = Teammate AI continues to execute after the player dies
motif = data/system.def ;Read path of system.def

[Rules]
Default.Attack.LifeToPowerMul = .7 ;The energy gained by the attacker after a successful attack. For example, if the value is 3, and a hit causes 10 points of damage, 30 points of energy will be gained.
Default.GetHit.LifeToPowerMul = .6 ;Same as the previous one, but the target is the victim.
Super.TargetDefenceMul = 1.5

[Config]
+ GameWidth = 1280 ;Recommended settings are: 640x480 SD || 1280x720 HD || 1920x1080 Full HD
+ GameHeight = 720
+ GameSpeed​​= 60 ;Game speed, the default is 60 frames per second, the larger the number, the faster the speed. This number should not be less than 10 (it is not recommended to modify this value)
+ FrameSkip = 0 ;Skip frame, the default value is 0
+ SamplerState = 00000_00000 ;When scaling an image, whether to use interpolation to draw the image, the default value is "00000_11111"

+ ;The first number, index image, when the scaling value is <.5
+ ;The second number, index image, .5 <=scaling value<1
+ ;The third number, index image, when the scaling value = 1
+ ;The fourth number, index image, 1 <zoom value<=5
+ ;The fifth number, index image, 5 <zoom value
+ ;The sixth number, RGB image, when the scaling value is <.5
+ ;The seventh number, RGB image, .5 <=scaling value<1
+ ;The eighth number, RGB image, when the scaling value = 1
+ ;The ninth number, RGB image, 1 <scaling value<=5
+ ;The tenth number, RGB image, 5 <scaling value

+ SelectScreenReducedHalf = 0 ;The size of the selection screen is halved, the default value is 0
+ FightReducedHalf = 0 ;The size of the Fight part is halved, the default value is 0
+ SelectScreenPageable = 0 ;Whether the selection interface can be paged, the default value is 0
+ SelectScreenShowAllImage = 1 ;Whether to display all images on the selection screen, the default value is 1 ;0 loads quickly and the phone is not prone to crashes
+ NotExistedCharHasSpace = 1 ;Whether to leave a space for non-existent characters, the default value is 1 ;sometimes the scene of the character selection interface uses pictures, and the display position is wrong, changing it to 0 can solve the problem
+ FightScale = 1,1 ;Health bar scaling, default value is 1,1
+ HeadPalFx = 1 ;The character portrait of the health bar changes color with the character, the default value is 0
+ GraphicsOffset = 0 ;Image offset, the default value is 0
+ PartnerPush = 0 ;Teammate push, the default value is 0
+ DeadCanOutScreenBound = 0 ;Whether the dead can leave the screen boundary, the default value is 0
+ DeadRemoveTime = 1000 ;Dead removal time, default value is 1000
+ Dead.Explods.RemoveTime = 1000 ;After the dead are removed, all the Explods of the dead are removed. -3 means no operation. The default value is 1000
+ Dead.Helpers.RemoveTime = 0 ;After the dead person is removed, the removal time of all the dead person's Helpers, -3 means no operation, the default value is 0
+ Dead.Helpers.Explods.RemoveTime = 0 ;After the dead person is removed, the removal time of all Explods of all Helpers of the dead person, -3 means no operation, the default value is 0

+ IdentifyEncoding = 3

+ ;When the program reads the character's text file, the encoding used is wrong, garbled characters will appear, and the character will fail to attack or behave abnormally...etc, this parameter is used to solve this problem
+ ;Default value is 1 :simple recognition, good compatibility, fast speed
+ ;0 = Use utf8 encoding to read text files, with average compatibility and fastest speed
+ ;2 = Moderate recognition, solves most garbled code problems, slow speed
+ ;3 = High-intensity recognition, supports more encodings, slowest speed
+ ;It is recommended that all text files be saved as UTF8 (with BOM) encoding, and then the parameter value is 1, so that there will be no garbled characters and the reading speed is super fast

+ AutoAddObject = 2 ;1 Automatically scan chars and stages, automatically add characters and scenes, 2 and all def files in the directory are automatically added, the default value is 0 not automatically added
+ StartLoadAllResource = 2 ;Load all the resources of the character when starting the game ;the default value is 0, no operation, fast character loading, little lag in battle, not easy to crash on mobile phones ;1, load files, slow loading, smooth in battle, easy to crash on mobile phones ;2, load files and parse files, slow loading, smoothest in battle, easy to crash on mobile phones ;3, more obvious than 2
+ LoadPngMode = 0 ;The way to load png images ;the default value is 0, intelligently select the fastest way ;1, use GPU ;2, use CpuStb ;3, use CpuCs
+ UseImageCache = 0 ;Whether to cache the decoded data of the image into [CQJ.Libs\ImageCache] when loading the image to speed up the next loading of the image. The default value is 0
+ AllDebugBg = -1 ;Set the DebugBg value of all scenes and storyboards, 0 is 0, 1 is 1, 2 is deleted, 3 is not drawn, the default value is -1 not set
+ DebugFontSamplerState = 2 ;Font for debugging ;the default value is 2, 0 is AnisotropicClamp, 1 is AnisotropicWrap, 2 is LinearClamp, 3 is LinearWrap, 4 is PointClamp, 5 is PointWrap
+ NewPlayerOrder = 1 ;The order value of the newly added character, the default value is 1
+ SelectLock = 0 ;Whether the character selection interface does not allow the addition of dragged characters and scenes, the default value is 0 ;when packaging and publishing the work, it can be set to 1 to prohibit players from adding other characters to pass the level
+ ForceFeedbackEnabled = 0 ;Whether to enable the vibration feedback function, the default value is 0
+ RandomSeed = 0 ;Random number seed, can be any number, the default value is 0, which means using an automatically generated number
+ ScreenSpeed = 1 ;The speed of screen animation playback, the default value is 1
+ ScreenOrientation = 6 ;Screen orientation, value range [-1,14], 0 is horizontal, 1 is vertical, 4 is free rotation, default value is 0

